<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robin Hood Stone — Runestone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #c9d4de; font-family: "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: 18px; }
    header, footer { pointer-events: auto; }
    .brand {
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(80,140,200,.25);
      padding: 12px 14px; border-radius: 14px; max-width: 360px;
    }
    .brand h1 { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: #6eb6ff; }
    .brand p { margin-top: 5px; font-size: 12px; opacity: .65; }
    footer { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      background: rgba(0,0,0,.5); color: #d5e6f5;
      border: 1px solid rgba(80,140,200,.3);
      border-radius: 999px; padding: 8px 13px; font: inherit; cursor: pointer;
    }
    button.active { background: #1a4a7a; border-color: #6eb6ff; color: #fff; }
  </style>
</head>
<body>
  <div id="hud">
    <header>
      <div class="brand">
        <h1>Robin Hood</h1>
        <p>Matte black runestone. Blue etch. Drag to orbit.</p>
      </div>
    </header>
    <div></div>
    <footer>
      <button class="shapeBtn active" data-shape="classic">Classic</button>
      <button class="shapeBtn" data-shape="split">Split</button>
      <button class="shapeBtn" data-shape="shield">Shield</button>
      <button class="shapeBtn" data-shape="menhir">Menhir</button>
      <button class="shapeBtn" data-shape="layered">Layered</button>
      <button id="btnSpin" class="active">Spin</button>
    </footer>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0.2, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enablePan = false;
    controls.minDistance = 1.8;
    controls.maxDistance = 8;
    controls.target.set(0, 0.05, 0);

    const uniforms = { u_time: { value: 0 } };

    const mat = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: `
        varying vec3 vPos;
        varying vec3 vNormal;
        varying vec3 vView;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vPos = position;
          vNormal = normalize(normalMatrix * normal);
          vView = normalize(cameraPosition - wp.xyz);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        precision mediump float;
        varying vec3 vPos;
        varying vec3 vNormal;
        varying vec3 vView;
        uniform float u_time;

        float hash(vec3 p){
          return fract(sin(dot(p, vec3(12.9898, 78.233, 37.147))) * 43758.5453);
        }
        float noise(vec3 p){
          vec3 i = floor(p);
          vec3 f = fract(p);
          f = f*f*(3.0-2.0*f);
          float n000 = hash(i);
          float n100 = hash(i + vec3(1,0,0));
          float n010 = hash(i + vec3(0,1,0));
          float n110 = hash(i + vec3(1,1,0));
          float n001 = hash(i + vec3(0,0,1));
          float n101 = hash(i + vec3(1,0,1));
          float n011 = hash(i + vec3(0,1,1));
          float n111 = hash(i + vec3(1,1,1));
          float nx00 = mix(n000, n100, f.x);
          float nx10 = mix(n010, n110, f.x);
          float nx01 = mix(n001, n101, f.x);
          float nx11 = mix(n011, n111, f.x);
          return mix(mix(nx00, nx10, f.y), mix(nx01, nx11, f.y), f.z);
        }

        void main() {
          vec3 col = vec3(0.02, 0.02, 0.02);
          float n = noise(vPos * 4.0 + vec3(0.0, u_time * 0.1, 0.0));
          float rune = smoothstep(0.45, 0.55, n);
          rune *= step(0.3, fract(vPos.x * 3.0 + vPos.z * 2.0));
          rune *= step(0.18, abs(vPos.x) + abs(vPos.y * 0.15));
          float pulse = 0.5 + 0.5 * sin(u_time * 2.0);
          vec3 runeColor = vec3(0.2, 0.6, 1.0) * rune * pulse;
          float rim = pow(1.0 - abs(dot(normalize(vNormal), normalize(vView))), 2.2);
          col += runeColor;
          col += rim * vec3(0.12, 0.18, 0.28);
          col += vec3(0.03) * max(dot(normalize(vNormal), normalize(vec3(0.4, 0.8, 0.5))), 0.0);
          float dust = step(0.992, noise(vPos * 7.0 + u_time));
          col += vec3(dust * 0.8);
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });

    function grit(geo, amt) {
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const n = v.clone();
        if (n.lengthSq() > 0) n.normalize();
        v.addScaledVector(n, (Math.random() - 0.5) * amt);
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    function classicGeo() {
      const w = 1.15, h = 1.7, d = 0.38;
      const geo = new THREE.BoxGeometry(w, h, d, 18, 28, 6);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const ny = (v.y + h / 2) / h;
        const nx = v.x / (w / 2);
        v.x *= 1 - ny * 0.2;
        if (ny > 0.82) v.y -= Math.abs(nx) * 0.28 + (nx > 0 ? 0.08 : 0);
        if (nx > 0.7 && ny > 0.25 && ny < 0.6) v.x -= 0.08;
        v.x += (ny - 0.5) * 0.06;
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      return grit(geo, 0.03);
    }
    function splitGeo() {
      const w = 1.12, h = 1.65, d = 0.36;
      const geo = new THREE.BoxGeometry(w, h, d, 18, 28, 6);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const ny = (v.y + h / 2) / h;
        const nx = v.x / (w / 2);
        v.x *= 1 - ny * 0.16;
        if (ny > 0.76) v.y -= (1 - Math.abs(nx)) * 0.36;
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      return grit(geo, 0.03);
    }
    function shieldGeo() {
      const w = 1.4, h = 1.35, d = 0.36;
      const geo = new THREE.BoxGeometry(w, h, d, 20, 22, 6);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const ny = (v.y + h / 2) / h;
        const nx = v.x / (w / 2);
        const arch = Math.sqrt(Math.max(0, 1 - nx * nx));
        if (ny > 0.7) v.y = -h / 2 + h * (0.7 + 0.3 * arch) * 0.92;
        if (ny < 0.22) v.x *= 0.8 + ny * 0.9;
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      return grit(geo, 0.025);
    }
    function menhirGeo() {
      const w = 1.0, h = 1.7, d = 0.55;
      const geo = new THREE.BoxGeometry(w, h, d, 16, 26, 10);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const ny = (v.y + h / 2) / h;
        const bulge = 0.75 + Math.sin(ny * Math.PI) * 0.35;
        v.x *= bulge;
        v.z *= 0.7 + Math.sin(ny * Math.PI) * 0.35;
        if (ny > 0.88) { v.x *= 0.65; v.y -= Math.abs(v.x) * 0.2; }
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      return grit(geo, 0.04);
    }

    const group = new THREE.Group();
    scene.add(group);

    function setShape(name) {
      while (group.children.length) {
        const ch = group.children[0];
        group.remove(ch);
        if (ch.geometry) ch.geometry.dispose();
      }
      if (name === 'layered') {
        [0,1,2].forEach((i) => {
          const mesh = new THREE.Mesh(classicGeo(), mat);
          mesh.position.set((i - 1) * 0.03, i * 0.015, (i - 1) * 0.1);
          mesh.scale.set(1 - i * 0.04, 1 - i * 0.02, 0.45);
          group.add(mesh);
        });
      } else {
        const makers = { classic: classicGeo, split: splitGeo, shield: shieldGeo, menhir: menhirGeo };
        group.add(new THREE.Mesh(makers[name](), mat));
      }
    }
    setShape('classic');

    document.querySelectorAll('.shapeBtn').forEach((btn) => {
      btn.onclick = function () {
        document.querySelectorAll('.shapeBtn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        setShape(btn.dataset.shape);
      };
    });
    document.getElementById('btnSpin').onclick = function (e) {
      controls.autoRotate = !controls.autoRotate;
      e.target.classList.toggle('active', controls.autoRotate);
    };
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    function tick() {
      requestAnimationFrame(tick);
      uniforms.u_time.value = clock.getElapsedTime();
      controls.update();
      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
