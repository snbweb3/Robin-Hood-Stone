<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robin Hood Stone — Interactive 3D NFT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #02030a; color: #eef2ee; font-family: "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: 22px; }
    header, footer { pointer-events: auto; }
    .brand {
      background: rgba(4, 8, 6, 0.55);
      border: 1px solid rgba(170, 210, 170, 0.22);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 14px 16px;
      max-width: 420px;
    }
    .brand h1 { font-size: 18px; letter-spacing: .16em; text-transform: uppercase; color: #c8e6c0; }
    .brand p { margin-top: 6px; font-size: 13px; opacity: .72; line-height: 1.4; }
    footer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    button, input[type="number"] {
      background: rgba(4, 8, 6, 0.55); color: #eef2ee;
      border: 1px solid rgba(170, 210, 170, 0.28);
      border-radius: 999px; padding: 10px 16px; font: inherit; cursor: pointer;
      backdrop-filter: blur(12px);
    }
    button:hover { border-color: #9fca90; }
    button.active { background: #9fca90; color: #102010; border-color: #9fca90; }
    input[type="number"] { width: 110px; }
    @media (max-width: 720px) { .brand h1 { font-size: 14px; } }
  </style>
</head>
<body>
  <div id="hud">
    <header>
      <div class="brand">
        <h1>Robin Hood</h1>
        <p>Drag to orbit. Scroll to zoom. Click the slab to catch the light.</p>
      </div>
    </header>
    <div></div>
    <footer>
      <button id="btnRandom">Random</button>
      <button id="btnSpin" class="active">Auto-spin</button>
      <label><input id="tokenInput" type="number" min="1" max="1111" value="1" /></label>
      <button id="btnLoad">Load</button>
    </footer>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const SUPPLY = 1111;
    function mulberry32(a) {
      return function () {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function tokenSeed(id) { return (id * 2654435761) >>> 0; }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02030a);
    scene.fog = new THREE.FogExp2(0x02030a, 0.018);

    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(2.6, 1.15, 5.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;
    controls.minDistance = 3.2;
    controls.maxDistance = 16;
    controls.target.set(0, 0.15, 0);

    scene.add(new THREE.AmbientLight(0xb8cfc0, 0.28));
    scene.add(new THREE.HemisphereLight(0xd7e8ff, 0x1a2a18, 0.55));

    const key = new THREE.DirectionalLight(0xfff4e0, 2.1);
    key.position.set(4.2, 7.2, 3.4);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 24;
    key.shadow.camera.left = -6;
    key.shadow.camera.right = 6;
    key.shadow.camera.top = 6;
    key.shadow.camera.bottom = -6;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xc8ffd4, 0.55);
    fill.position.set(-5, 2.2, -2);
    scene.add(fill);

    const rim = new THREE.SpotLight(0xffffff, 18, 18, 0.35, 0.55, 1.1);
    rim.position.set(-2.4, 5.5, 4.2);
    rim.target.position.set(0, 0.2, 0);
    scene.add(rim);
    scene.add(rim.target);

    const bounce = new THREE.PointLight(0x9fca90, 4.5, 12);
    bounce.position.set(0, -0.6, 2.4);
    scene.add(bounce);

    const group = new THREE.Group();
    scene.add(group);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(9, 72),
      new THREE.MeshStandardMaterial({ color: 0x0a0e12, roughness: 0.96, metalness: 0.04 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.55;
    ground.receiveShadow = true;
    scene.add(ground);

    function makeGalaxy() {
      const n = 1800;
      const pos = new Float32Array(n * 3);
      const col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const band = Math.random() < 0.38;
        let x, y, z;
        if (band) {
          const a = Math.random() * Math.PI * 2;
          const r = 8 + Math.random() * 28;
          x = Math.cos(a) * r;
          y = (Math.random() - 0.5) * 3.2 + Math.sin(a * 2) * 1.4;
          z = Math.sin(a) * r * 0.35 + (Math.random() - 0.5) * 10;
        } else {
          const r = 10 + Math.random() * 40;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          x = r * Math.sin(phi) * Math.cos(theta);
          y = r * Math.cos(phi);
          z = r * Math.sin(phi) * Math.sin(theta);
        }
        pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
        const w = 0.82 + Math.random() * 0.18;
        col[i * 3] = w; col[i * 3 + 1] = w; col[i * 3 + 2] = w;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const stars = new THREE.Points(g, new THREE.PointsMaterial({
        size: 0.045, vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false
      }));
      scene.add(stars);
      return stars;
    }
    const galaxy = makeGalaxy();

    function stoneGeometry(rng) {
      const w = 1.42, h = 2.66, d = 0.38;
      const geo = new THREE.BoxGeometry(w, h, d, 22, 36, 6);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const ny = (v.y + h / 2) / h;
        const nx = v.x / (w / 2);
        const nz = v.z / (d / 2);
        v.x *= 1 - ny * (0.17 + rng() * 0.07);
        if (ny > 0.86) {
          v.y -= Math.abs(nx) * (0.2 + rng() * 0.1);
          if (Math.abs(nx) > 0.55) v.y -= 0.07 * Math.abs(nx);
        }
        const edge = Math.max(Math.abs(nx), Math.abs(nz) * 0.55);
        if (edge > 0.8) {
          const chip = (edge - 0.8) * (0.1 + rng() * 0.16);
          v.x *= 1 - chip * 0.32;
          if (Math.abs(nz) > 0.68) v.z *= 1 - chip * 0.45;
        }
        const grit = Math.sin(v.x * 8.5 + rng() * 10) * Math.cos(v.y * 6.5) * 0.014 + (rng() - 0.5) * 0.02;
        const nrm = v.clone();
        if (nrm.lengthSq() > 0.0001) nrm.normalize();
        v.addScaledVector(nrm, grit);
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    let stone, pulse = 0;

    function growStone(tokenId) {
      const rng = mulberry32(tokenSeed(tokenId));
      while (group.children.length) group.remove(group.children[0]);

      const tint = new THREE.Color().setHSL(0.33 + (rng() - 0.5) * 0.04, 0.28, 0.46 + rng() * 0.08);
      const mat = new THREE.MeshPhysicalMaterial({
        color: tint,
        roughness: 0.42 + rng() * 0.16,
        metalness: 0.08,
        clearcoat: 0.55,
        clearcoatRoughness: 0.28,
        reflectivity: 0.35,
        sheen: 0.25,
        sheenColor: new THREE.Color(0xd7f0c8),
        sheenRoughness: 0.7,
        transparent: false,
        opacity: 1,
        envMapIntensity: 1.1
      });

      stone = new THREE.Mesh(stoneGeometry(rng), mat);
      stone.castShadow = true;
      stone.receiveShadow = true;
      group.add(stone);
      document.getElementById('tokenInput').value = tokenId;
    }

    growStone(1);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      if (stone && raycaster.intersectObject(stone).length) pulse = 1;
    });

    document.getElementById('btnRandom').onclick = function () {
      growStone(1 + Math.floor(Math.random() * SUPPLY));
    };
    document.getElementById('btnLoad').onclick = function () {
      growStone(Math.max(1, Math.min(SUPPLY, Number(document.getElementById('tokenInput').value) || 1)));
    };
    document.getElementById('btnSpin').onclick = function (e) {
      controls.autoRotate = !controls.autoRotate;
      e.target.classList.toggle('active', controls.autoRotate);
    };
    window.addEventListener('resize', function () {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    function tick() {
      const t = clock.getElapsedTime();
      requestAnimationFrame(tick);
      if (pulse > 0) {
        group.scale.setScalar(1 + Math.sin(pulse * Math.PI) * 0.04);
        key.intensity = 2.1 + pulse * 1.4;
        pulse = Math.max(0, pulse - 0.04);
      } else {
        group.scale.setScalar(1);
        key.intensity = 2.1 + Math.sin(t * 0.7) * 0.12;
      }
      galaxy.rotation.y = t * 0.008;
      rim.intensity = 16 + Math.sin(t * 0.9) * 2.5;
      controls.update();
      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
